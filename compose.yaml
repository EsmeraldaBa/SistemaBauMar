name: baumar-local

services:
  mysql:
    image: mysql:8.4
    container_name: baumar_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en BauMar/.env}
      MYSQL_DATABASE: ${DB_NAME:-baumar}
      MYSQL_USER: ${DB_USER:?Define DB_USER en BauMar/.env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en BauMar/.env}
    ports:
      - "127.0.0.1:${MYSQL_EXPOSED_PORT:-3307}:3306"
    volumes:
      - baumar_mysql_data:/var/lib/mysql
      - ./server/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: deploy/backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      CLIENT_ORIGIN: http://localhost:8080
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en BauMar/.env con al menos 32 caracteres}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-baumar}
      DB_USER: ${DB_USER:?Define DB_USER en BauMar/.env}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en BauMar/.env}
      PASSWORD_RESET_BASE_URL: http://localhost:8080
      RESET_TOKEN_EXPOSE_IN_DEVELOPMENT: "false"
      MAX_WORKSHOP_IMAGE_MB: ${MAX_WORKSHOP_IMAGE_MB:-5}
      MAX_VEHICLE_IMAGE_MB: ${MAX_VEHICLE_IMAGE_MB:-15}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./server/uploads:/app/server/uploads
      - ./server/logs:/app/server/logs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  baumar_mysql_data:
    external: true
    name: newproject_baumar_mysql_data
